[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpe-storage-flowkit-py"
version = "0.9.3"
description = "Python client library for interacting with HPE Alletra MP storage arrays."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hewlett Packard Enterprise Development LP" }
]
dependencies = [
    "paramiko==4.0.0",
    "requests==2.32.5"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration"
]

[tool.setuptools]
include-package-data = true
packages = [
    "hpe_storage_flowkit_py",
    "hpe_storage_flowkit_py.v1",
    "hpe_storage_flowkit_py.v1.src",
    "hpe_storage_flowkit_py.v1.src.core",
    "hpe_storage_flowkit_py.v1.src.utils",
    "hpe_storage_flowkit_py.v1.src.validators",
    "hpe_storage_flowkit_py.v1.src.workflows",
    "hpe_storage_flowkit_py.v3",
    "hpe_storage_flowkit_py.v3.src",
    "hpe_storage_flowkit_py.v3.src.core",
    "hpe_storage_flowkit_py.v3.src.utils",
    "hpe_storage_flowkit_py.v3.src.validators",
    "hpe_storage_flowkit_py.v3.src.workflows"
]

[tool.setuptools.package-dir]
"hpe_storage_flowkit_py" = "."